name: 本轮生产工作流重跑验收
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-reliability.yml']
permissions:
  contents: read
  actions: write
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 已发账本存在时触发原生产工作流（零重复投递、零模型调用）
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          class NoRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          opener = urllib.request.build_opener(NoRedirects())
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          req = urllib.request.Request(base + '/contents/reading-ledger.json?ref=digest-delivery-state', headers=headers)
          with opener.open(req, timeout=25) as response: content=json.load(response)
          ledger=json.loads(base64.b64decode(content['content']))
          today=datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          assert any(row['edition']=='daily' and row['period']==today for row in ledger['history']['deliveries']), 'No confirmed delivery today; refusing live send check'
          assert not any(row['edition']=='daily' and row['period']==today for row in ledger['pending'])
          payload={'ref':'main','inputs':{'edition':'daily','send_mail':True}}
          req=urllib.request.Request(base+'/actions/workflows/daily-digest.yml/dispatches',
              headers=headers, data=json.dumps(payload).encode(), method='POST')
          with opener.open(req,timeout=25) as response: assert response.status==204
          print('::notice title=Production repeat check::dispatched=true;expected_status=already_sent;expected_model_calls=0;expected_mail_sent=false')
          PY
