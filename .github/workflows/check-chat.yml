name: 检查 API 密钥与普通调用

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-chat.yml'
  workflow_dispatch:
    inputs:
      chat_call:
        description: '额外调用一次模型（可能计费）；不勾选则只读取模型目录'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  chat:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DIGEST_API_BASE: https://n.tokeness.dev/v1
      DIGEST_MODEL: gpt-6-luna
      DIGEST_API_KEY: ${{ secrets.DIGEST_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: 显示密钥是否已配置（不显示内容）
        run: |
          python - <<'PY'
          import os
          configured = bool(os.environ.get('DIGEST_API_KEY', '').strip())
          print('::notice title=API configuration::api_key_configured=' + str(configured).lower())
          PY
      - name: 读取此密钥可用的 GPT 型号
        run: python scripts/check_connection.py --mode catalog --report .local/model-catalog.json
      - name: 使用目录中列出的型号
        if: github.event_name == 'workflow_dispatch' && inputs.chat_call == true
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.check_connection import GPT_CANDIDATES
          model = json.loads(Path('.local/model-catalog.json').read_text())['suggested_model']
          if model not in GPT_CANDIDATES:
              raise SystemExit('No supported GPT model was listed.')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('DIGEST_MODEL=' + model + '\n')
          print('::notice title=Selected API model::' + model)
          PY
      - name: 原始示例的一次普通对话
        if: github.event_name == 'workflow_dispatch' && inputs.chat_call == true
        run: python scripts/check_connection.py --mode chat
      - name: 显示普通 API 验证结果
        if: always()
        run: |
          python - <<'PY'
          import html
          import json
          import os
          from pathlib import Path
          report = Path('.local/connection-report.json')
          if not report.exists():
              report = Path('.local/model-catalog.json')
          if report.exists():
              value = json.loads(report.read_text(encoding='utf-8'))
              rendered = html.escape(json.dumps(value, ensure_ascii=False, indent=2))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
                  stream.write('<h2>普通 API 验证结果</h2><pre>' + rendered + '</pre>')
              # Publish fixed labels and the separately redacted provider hint.
              status = value.get('http_status')
              status = str(status) if type(status) is int and 100 <= status <= 599 else 'unavailable'
              categories = {'no_available_model_channel', 'quota_or_balance',
                            'credential_rejected', 'token_parameter_rejected',
                            'model_rejected', 'search_tool_parameter_rejected', 'request_rejected'}
              category = value.get('error_category')
              if not isinstance(category, str) or category not in categories:
                  category = {'API credential is missing.': 'credential_missing',
                              'API credential is invalid.': 'credential_invalid',
                              'Model configuration is invalid.': 'model_configuration_invalid',
                              'Connection failed; no retry was attempted.': 'connection_failed',
                              'Response was not a supported JSON object.': 'response_format_invalid',
                              'No supported GPT model was listed.': 'no_compatible_model',
                              'Model directory did not contain a model list.': 'invalid_model_directory',
                              'HTTP request was not accepted.': 'http_rejected'}.get(value.get('error'), 'unclassified')
              finish = value.get('finish_reason')
              finish = finish if isinstance(finish, str) and finish in {'stop', 'length', 'content_filter', 'tool_calls', 'function_call'} else 'unavailable'
              received = 'true' if value.get('model_reply_received') is True else 'false'
              catalog_received = ('true' if type(value.get('http_status')) is int
                                  and 200 <= value['http_status'] < 300
                                  and isinstance(value.get('suggested_model'), str) else 'false')
              print('::notice title=API diagnostic::http_status=' + status + '; category=' + category
                    + '; model_directory_received=' + catalog_received
                    + '; model_reply_received=' + received + '; finish_reason=' + finish)
              from scripts.check_connection import GPT_CANDIDATES
              suggested = value.get('suggested_model')
              if catalog_received == 'true' and suggested in GPT_CANDIDATES:
                  print('::notice title=Available API model::' + suggested)
              hint = value.get('provider_error_hint')
              if isinstance(hint, str) and hint:
                  hint = hint.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice title=Provider error (redacted)::' + hint)
              model_ids = value.get('listed_model_ids')
              if isinstance(model_ids, list):
                  import re
                  safe_ids = [name for name in model_ids if isinstance(name, str)
                              and re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._/-]{0,79}', name)]
                  print('::notice title=Listed model IDs::' + ', '.join(safe_ids))
                  count = value.get('listed_model_count')
                  if type(count) is int and count >= 0:
                      print('::notice title=Model directory size::' + str(count))
          PY
