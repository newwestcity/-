name: 搜索来源修复验证
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-search.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routes:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[probe-search-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DIGEST_API_BASE: ${{ vars.DIGEST_API_BASE || 'https://n.tokeness.dev/v1' }}
      DIGEST_API_KEY: ${{ secrets.DIGEST_API_KEY }}
      DIGEST_SEARCH_MODEL: gpt-5.6-luna
      PROBE_SOURCE: X
      PROBE_NATURAL: 'true'
      PROBE_CATEGORY: AI
      DIGEST_MODEL: ${{ vars.DIGEST_MODEL || 'gpt-6-luna' }}
      SMTP_USERNAME: preview@example.invalid
      GH_TOKEN: ${{ github.token }}
      EDITION: daily
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: 从真实账本加载去重记录（只读）
        run: |
          python - <<'PY'
          from pathlib import Path
          from x_digest.delivery_ledger import open_ledger
          from x_digest.reading_state import save_state
          ledger = open_ledger({'version':2,'deliveries':[]},allow_create=False)
          save_state(Path('.local/reading-state.json'),ledger.history)
          print('::notice title=Repair history::durable_history_loaded=true;mail_sent=false')
          PY
      - name: 验证与生产相同的自然语言检索（仅AI一类一次）
        run: python scripts/probe_verified_search.py
      - name: 保存合格阅读和可复用的核验快照
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: x-natural-query-probe
          path: .local/verified-search-probe.json
          retention-days: 7
          if-no-files-found: ignore
