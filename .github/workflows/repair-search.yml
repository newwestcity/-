name: 搜索来源修复验证
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-search.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routes:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[probe-search-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      DIGEST_API_BASE: ${{ vars.DIGEST_API_BASE || 'https://n.tokeness.dev/v1' }}
      DIGEST_API_KEY: ${{ secrets.DIGEST_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: 读取密钥可用模型与接口路由（不调用模型）
        run: python scripts/probe_search_routes.py
  public:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[probe-search-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: 验证六个公开搜索来源（正常匿名访问，不绕过挑战）
        run: python scripts/probe_public_search.py
