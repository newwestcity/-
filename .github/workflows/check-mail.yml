name: 邮箱连接测试

on:
  push:
    paths:
      - scripts/check_mail.py
      - .github/workflows/check-mail.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mail-connection-test
  cancel-in-progress: false

jobs:
  send-test:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
      SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
      MAIL_TO: ${{ vars.MAIL_TO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: 显示配置是否存在（不显示内容）
        run: |
          python - <<'PY'
          import json
          import os
          status = {name + '_configured': bool(os.environ.get(name, '').strip())
                    for name in ('SMTP_USERNAME', 'SMTP_AUTH_CODE', 'MAIL_TO')}
          print('::notice title=Mail configuration::' + json.dumps(status))
          PY
      - name: 发送邮箱连接测试
        run: python scripts/check_mail.py --send-test
