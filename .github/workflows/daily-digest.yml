name: 每日阅读与 GitHub 周刊

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # 每日北京时间08:00
    - cron: '17 1,2,6 * * *' # 09:17/10:17/14:17补跑；已发则跳过
  workflow_dispatch:
    inputs:
      edition:
        description: 选择每日阅读或每周项目
        type: choice
        options: [daily, weekly]
        default: daily
      send_mail:
        description: '发送真实邮件（不勾选则只生成预览；搜索API仍可能计费）'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.run_id || 'daily-x-digest' }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.schedule.outputs.matrix }}
      has_editions: ${{ steps.schedule.outputs.has_editions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: 检查每日计划开关
        id: schedule
        env:
          DAILY_OVERRIDE: ${{ vars.DIGEST_ENABLED }}
          WEEKLY_OVERRIDE: ${{ vars.GITHUB_WEEKLY_ENABLED }}
          EDITION: ${{ inputs.edition || 'daily' }}
        run: python scripts/plan_schedule.py
      - run: python -m unittest discover -s tests -v

  digest:
    needs: tests
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      needs.tests.outputs.has_editions == 'true'
    permissions:
      contents: write # 仅用于独立的投递账本分支；不修改应用代码
    strategy:
      fail-fast: false # 日报失败仍继续周刊
      max-parallel: 1 # 两期串行读写同一份投递历史
      matrix: ${{ fromJSON(needs.tests.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35 # 搜索共用单槽，覆盖有界最坏耗时及编辑阶段
    env:
      DIGEST_API_BASE: ${{ vars.DIGEST_API_BASE || 'https://n.tokeness.dev/v1' }}
      DIGEST_MODEL: ${{ vars.DIGEST_MODEL || 'gpt-6-luna' }}
      DIGEST_SEARCH_MODEL: ${{ vars.DIGEST_SEARCH_MODEL || 'gpt-5.6-luna' }}
      DIGEST_API_KEY: ${{ secrets.DIGEST_API_KEY }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
      SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
      MAIL_TO: ${{ vars.MAIL_TO }}
      GH_TOKEN: ${{ github.token }}
      DIGEST_REQUIRE_LEDGER: 'true'
      EDITION: ${{ matrix.edition }}
      SEND_MAIL: ${{ github.event_name == 'schedule' || inputs.send_mail == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: history
        with:
          path: |
            .local/state.json
            .local/reading-state.json
          key: reading-history-v2-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.edition }}
          restore-keys: |
            reading-history-v2-
      - name: 首次升级导入旧X历史
        if: steps.history.outputs.cache-matched-key == ''
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .local/state.json
          key: x-digest-history-v1-migrate-${{ github.run_id }}
          restore-keys: x-digest-history-v1-
      - name: 恢复未发送的备用阅读
        if: matrix.edition == 'daily'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .local/reading-reserve.json
          key: reading-reserve-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: reading-reserve-v1-
      - name: 检查配置
        shell: bash
        run: |
          if [[ "$SEND_MAIL" == "true" ]]; then
            python -m x_digest --check --send
          else
            python -m x_digest --check
          fi
      - name: 搜索并生成阅读推荐
        id: run
        shell: bash
        run: |
          mkdir -p .local
          if [[ "$SEND_MAIL" == "true" ]]; then
            python -m x_digest --fetch --send --edition "$EDITION" | tee .local/run-result.json
          else
            python -m x_digest --fetch --edition "$EDITION" | tee .local/run-result.json
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('.local/run-result.json').read_text())
          status = result.get('status')
          if status not in {'smtp_accepted', 'already_sent', 'preview', 'no_material'}:
              raise SystemExit('Unexpected result status')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('status=' + status + '\n')
          if status == 'no_material':
              print('::warning title=Reading sources unavailable::No qualified material; no mail sent; next catch-up remains eligible.')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
                  stream.write('本期暂未取得合格材料，未发送邮件；已保留来源诊断，后续补跑仍可继续。\n')
          PY
      - name: 保存已发记录
        if: success() && env.SEND_MAIL == 'true' && (steps.run.outputs.status == 'smtp_accepted' || steps.run.outputs.status == 'already_sent')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .local/state.json
            .local/reading-state.json
          key: reading-history-v2-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.edition }}
      - name: 保存未发送的备用阅读（投递失败时也保留）
        if: always() && matrix.edition == 'daily' && hashFiles('.local/reading-reserve.json') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .local/reading-reserve.json
          key: reading-reserve-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 保存预览（不含邮箱地址和密钥）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-preview-${{ matrix.edition }}
          path: |
            .local/preview/digest.html
            .local/preview/status.html
          retention-days: 7
          if-no-files-found: ignore
      - name: 显示安全运行诊断（失败时也保留）
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('reading-audit.json', 'run-result.json'):
              path = Path('.local') / name
              if not path.exists() or path.stat().st_size > 65536:
                  continue
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except (ValueError, OSError):
                  continue
              allowed = {'edition', 'coverage', 'diagnostics'} if name == 'reading-audit.json' else {
                  'status', 'edition', 'date', 'period', 'count', 'source_counts', 'classic_count', 'link_candidate_count'}
              if not isinstance(data, dict):
                  continue
              report = {key: value for key, value in data.items() if key in allowed}
              text = json.dumps(report, ensure_ascii=False, separators=(',', ':'))
              print('::notice title=Reading run diagnostic::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: 保存来源诊断
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reading-run-diagnostics-${{ matrix.edition }}
          path: |
            .local/reading-audit.json
            .local/run-result.json
            .local/status-report.json
          if-no-files-found: ignore
          retention-days: 7
