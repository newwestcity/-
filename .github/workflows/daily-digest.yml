name: 每日阅读与 GitHub 周刊

on:
  push:
  schedule:
    - cron: '0 0 * * *' # 每日北京时间08:00
    - cron: '0 0 * * 0' # 周日北京时间08:00，单独的GitHub周刊
  workflow_dispatch:
    inputs:
      edition:
        description: 选择每日阅读或每周项目
        type: choice
        options: [daily, weekly]
        default: daily
      send_mail:
        description: '发送真实邮件（不勾选则只生成预览；搜索API仍可能计费）'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.run_id || 'daily-x-digest' }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    outputs:
      daily_enabled: ${{ steps.schedule.outputs.daily_enabled }}
      weekly_enabled: ${{ steps.schedule.outputs.weekly_enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: 检查每日计划开关
        id: schedule
        env:
          DAILY_OVERRIDE: ${{ vars.DIGEST_ENABLED }}
          WEEKLY_OVERRIDE: ${{ vars.GITHUB_WEEKLY_ENABLED }}
        run: |
          python - <<'PY'
          import os
          value = os.environ.get('DAILY_OVERRIDE', '').strip().lower()
          if value not in {'', 'true', 'false'}:
              print('::error::Invalid DIGEST_ENABLED value; use true or false.')
              raise SystemExit(2)
          weekly = os.environ.get('WEEKLY_OVERRIDE', '').strip().lower()
          if weekly not in {'', 'true', 'false'}:
              print('::error::Invalid GITHUB_WEEKLY_ENABLED value; use true or false.')
              raise SystemExit(2)
          enabled = value != 'false'
          flag = str(enabled).lower()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('daily_enabled=' + flag + '\n')
              stream.write('weekly_enabled=' + str(enabled and weekly != 'false').lower() + '\n')
          print('::notice title=Reading schedules::daily=' + flag + '; weekly=' + str(enabled and weekly != 'false').lower() + '; time=08:00 Asia/Shanghai; weekly_day=Sunday')
          PY
      - run: python -m unittest discover -s tests -v

  digest:
    needs: tests
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
        ((github.event.schedule == '0 0 * * 0' && needs.tests.outputs.weekly_enabled == 'true') ||
        (github.event.schedule == '0 0 * * *' && needs.tests.outputs.daily_enabled == 'true'))))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DIGEST_API_BASE: ${{ vars.DIGEST_API_BASE || 'https://n.tokeness.dev/v1' }}
      DIGEST_MODEL: ${{ vars.DIGEST_MODEL || 'gpt-6-luna' }}
      DIGEST_API_KEY: ${{ secrets.DIGEST_API_KEY }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
      SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
      MAIL_TO: ${{ vars.MAIL_TO }}
      GH_TOKEN: ${{ github.token }}
      EDITION: ${{ github.event.schedule == '0 0 * * 0' && 'weekly' || inputs.edition || 'daily' }}
      SEND_MAIL: ${{ github.event_name == 'schedule' || inputs.send_mail == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: history
        with:
          path: |
            .local/state.json
            .local/reading-state.json
          key: reading-history-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            reading-history-v2-
      - name: 首次升级导入旧X历史
        if: steps.history.outputs.cache-matched-key == ''
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .local/state.json
          key: x-digest-history-v1-migrate-${{ github.run_id }}
          restore-keys: x-digest-history-v1-
      - name: 检查配置
        shell: bash
        run: |
          if [[ "$SEND_MAIL" == "true" ]]; then
            python -m x_digest --check --send
          else
            python -m x_digest --check
          fi
      - name: 搜索并生成阅读推荐
        id: run
        shell: bash
        run: |
          if [[ "$SEND_MAIL" == "true" ]]; then
            python -m x_digest --fetch --send --edition "$EDITION"
          else
            python -m x_digest --fetch --edition "$EDITION"
          fi
      - name: 保存已发记录
        if: success() && env.SEND_MAIL == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .local/state.json
            .local/reading-state.json
          key: reading-history-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 保存预览（不含邮箱地址和密钥）
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-preview
          path: .local/preview/digest.html
          retention-days: 7
          if-no-files-found: ignore
