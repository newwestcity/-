name: 每日 X 精选

on:
  push:
  schedule:
    - cron: '0 8 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      send_mail:
        description: '发送真实邮件（不勾选则只生成预览；搜索API仍可能计费）'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: daily-x-digest
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  digest:
    needs: tests
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.DIGEST_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DIGEST_API_BASE: ${{ vars.DIGEST_API_BASE || 'https://n.tokeness.dev/v1' }}
      DIGEST_MODEL: ${{ vars.DIGEST_MODEL || 'gpt-6-luna' }}
      DIGEST_API_KEY: ${{ secrets.DIGEST_API_KEY }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
      SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
      MAIL_TO: ${{ vars.MAIL_TO }}
      SEND_MAIL: ${{ github.event_name == 'schedule' || inputs.send_mail == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: history
        with:
          path: .local/state.json
          key: x-digest-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: x-digest-history-v1-
      - name: 检查配置
        shell: bash
        run: |
          if [[ "$SEND_MAIL" == "true" ]]; then
            python -m x_digest --check --send
          else
            python -m x_digest --check
          fi
      - name: 搜索并生成日报
        id: run
        shell: bash
        run: |
          if [[ "$SEND_MAIL" == "true" ]]; then
            python -m x_digest --fetch --send
          else
            python -m x_digest --fetch
          fi
      - name: 保存已发记录
        if: success() && env.SEND_MAIL == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .local/state.json
          key: x-digest-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 保存预览（不含邮箱地址和密钥）
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-preview
          path: .local/preview/digest.html
          retention-days: 7
          if-no-files-found: ignore
