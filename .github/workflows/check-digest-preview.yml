name: 阅读与项目完整预览
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-digest-preview.yml']
  workflow_dispatch:
    inputs:
      edition:
        description: 选择预览版次（实际检索与编辑可能计费，不发邮件）
        type: choice
        options: [daily, weekly, both, snowball]
        default: daily
permissions:
  contents: read
jobs:
  preview:
    if: github.ref_name == github.event.repository.default_branch
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ github.event_name == 'push' && fromJSON('["snowball"]') || inputs.edition == 'snowball' && fromJSON('["snowball"]') || inputs.edition == 'weekly' && fromJSON('["weekly"]') || inputs.edition == 'daily' && fromJSON('["daily"]') || fromJSON('["daily","weekly"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DIGEST_API_BASE: ${{ vars.DIGEST_API_BASE || 'https://n.tokeness.dev/v1' }}
      DIGEST_MODEL: ${{ vars.DIGEST_MODEL || 'gpt-6-luna' }}
      DIGEST_API_KEY: ${{ secrets.DIGEST_API_KEY }}
      SMTP_USERNAME: preview@example.invalid
      GH_TOKEN: ${{ github.token }}
      EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -q
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: history
        with:
          path: |
            .local/state.json
            .local/reading-state.json
          key: reading-history-v2-preview-${{ github.run_id }}-${{ matrix.edition }}
          restore-keys: |
            reading-history-v2-
      - name: 首次升级导入旧X历史
        if: steps.history.outputs.cache-matched-key == ''
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .local/state.json
          key: x-digest-history-v1-migrate-${{ github.run_id }}
          restore-keys: x-digest-history-v1-
      - name: 雪球公开页面结构诊断（不执行挑战脚本）
        if: matrix.edition == 'daily'
        run: python scripts/inspect_xueqiu_access.py
      - name: 实际检索、原文评审与预览（不发邮件）
        if: matrix.edition != 'snowball'
        run: python scripts/preview_reading.py
      - name: 雪球搜索标题链接预览（未读全文、不评分、不发邮件）
        if: matrix.edition == 'snowball'
        run: python scripts/preview_xueqiu_links.py
      - name: 保存阅读预览
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reading-preview-${{ matrix.edition }}
          path: |
            .local/preview/digest.html
            .local/reading-audit.json
          retention-days: 7
          if-no-files-found: ignore
