name: 修复后的真实阅读验收
on:
  push:
    branches: [main]
    paths: ['.github/workflows/send-repair-example.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: daily-x-digest
  cancel-in-progress: false
jobs:
  deliver:
    if: contains(github.event.head_commit.message, '[send-repair-example]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
      SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
      MAIL_TO: ${{ vars.MAIL_TO }}
      SOURCE_RUN: '39980910253'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: 验证快照来自已通过的主分支修复预览
        run: |
          mkdir -p .local
          gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion,headBranch,workflowName,status > .local/example-source.json
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('.local/example-source.json').read_text())
          expected='bfd96edfd9885141177b92e0fa946c8fbba66f6d'
          assert source['headSha']==expected and source['headBranch']=='main'
          assert source['conclusion']=='success' and source['status']=='completed'
          assert source['workflowName']=='搜索来源修复验证'
          print('::notice title=Repair snapshot provenance::main=true;source_completed=true;source_success=true;new_model_calls=0')
          PY
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name repaired-daily-preview --dir .local/example-source
      - name: 重验未读材料并真实投递（独立验收名额）
        run: |
          python scripts/send_repaired_example.py --send --source-dir .local/example-source --work-dir .local/repaired-example | tee .local/example-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('.local/example-result.json').read_text())
          print('::notice title=Repair example delivery::'+json.dumps(value,ensure_ascii=False,separators=(',',':')))
          PY
